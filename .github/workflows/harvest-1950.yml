name: Harvest 1950 Gazettes (Apartheid Legislative Cascade)

on:
  push:
    branches: [main]
    paths:
      - 'gazette_archaeologist.py'
      - '.github/workflows/harvest-1950.yml'
  
  workflow_dispatch:
    inputs:
      target_year:
        description: 'Year to harvest (default: 1950)'
        required: false
        default: '1950'
      max_workers:
        description: 'Concurrent workers (default: 3)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run mode (no uploads)'
        required: false
        default: 'false'
  
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2AM UTC

env:
  RATE_LIMIT: '2.0'
  MAX_RETRIES: '3'
  DB_POOL_MIN: '2'
  DB_POOL_MAX: '10'

jobs:
  # Pre-flight health checks
  health-check:
    runs-on: ubuntu-latest
    environment: production
    
    outputs:
      database_ok: ${{ steps.check.outputs.database_ok }}
      storage_ok: ${{ steps.check.outputs.storage_ok }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary requests oss2
      
      - name: Health check
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALIBABA_ACCESS_KEY_ID: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          ALIBABA_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          ALIBABA_ENDPOINT: ${{ secrets.ALIBABA_ENDPOINT }}
          BUCKET_NAME: meta-historian-gazettes
        shell: bash
        run: |
          python3 << 'PYEOF'
          import psycopg2
          import os
          import sys
          
          # Database check
          try:
              conn = psycopg2.connect(os.getenv('DATABASE_URL'), connect_timeout=10)
              cur = conn.cursor()
              cur.execute('SELECT 1')
              print('✓ Database check passed')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('database_ok=ok\n')
          except Exception as e:
              print(f'✗ Database check failed: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('database_ok=failed\n')
              sys.exit(1)
          finally:
              if 'conn' in locals():
                  conn.close()
          
          # Storage check
          try:
              import oss2
              auth = oss2.Auth(
                  os.getenv('ALIBABA_ACCESS_KEY_ID'),
                  os.getenv('ALIBABA_ACCESS_KEY_SECRET')
              )
              bucket = oss2.Bucket(
                  auth,
                  os.getenv('ALIBABA_ENDPOINT'),
                  os.getenv('BUCKET_NAME')
              )
              bucket.get_bucket_info()
              print('✓ Storage check passed')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('storage_ok=ok\n')
          except Exception as e:
              print(f'✗ Storage check failed: {e}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('storage_ok=failed\n')
              sys.exit(1)
          PYEOF
  
  # Main harvest job
  harvest:
    runs-on: ubuntu-latest
    needs: health-check
    if: needs.health-check.outputs.database_ok == 'ok' && needs.health-check.outputs.storage_ok == 'ok'
    environment: production
    timeout-minutes: 180  # 3 hours max
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STORAGE_PROVIDER: alibaba
      ALIBABA_ACCESS_KEY_ID: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
      ALIBABA_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
      ALIBABA_ENDPOINT: ${{ secrets.ALIBABA_ENDPOINT }}
      BUCKET_NAME: meta-historian-gazettes
      TARGET_YEAR: ${{ github.event.inputs.target_year || '1950' }}
      MAX_WORKERS: ${{ github.event.inputs.max_workers || '3' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            psycopg2-binary \
            pdfplumber \
            requests \
            oss2 \
            python-dateutil \
            boto3
      
      - name: Verify installation
        run: |
          python -c "import psycopg2; import pdfplumber; import oss2; print('All imports OK')"
      
      - name: Run Harvester
        id: harvest
        shell: bash
        run: |
          echo "🚀 Starting harvest for year $TARGET_YEAR"
          echo "Configuration: $MAX_WORKERS workers, dry_run=$DRY_RUN"
          
          # Run harvester and capture exit code
          python gazette_archaeologist.py --year "$TARGET_YEAR" --max-workers "$MAX_WORKERS" ${DRY_RUN:+--dry-run}
          EXIT_CODE=$?
          
          # Check for expected log file
          if [ ! -f "harvester_${TARGET_YEAR}.log" ]; then
            echo "❌ ERROR: Expected log file harvester_${TARGET_YEAR}.log not found"
            exit 1
          fi
          
          # Check exit code
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ ERROR: Harvester exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          echo "harvest_status=success" >> $GITHUB_OUTPUT
          echo "✅ Harvest completed successfully"
      
      - name: Extract metrics
        if: always()
        run: |
          if [ -f "harvester_$TARGET_YEAR.log" ]; then
            echo "📊 Harvest Metrics:"
            grep -E "(Discovered|Stored|✅ Harvest complete)" "harvester_$TARGET_YEAR.log" | tail -20
          else
            echo "⚠️  Log file not found"
          fi
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-artifacts-${{ env.TARGET_YEAR }}-${{ github.run_number }}
          path: |
            harvester_*.log
            harvest_metrics_*.json
          retention-days: 30
      
      - name: Check for failures
        if: always()
        run: |
          if [ -f "harvester_$TARGET_YEAR.log" ]; then
            ERRORS=$(grep -c "ERROR" "harvester_$TARGET_YEAR.log" || echo "0")
            FAILURES=$(grep -c "💥" "harvester_$TARGET_YEAR.log" || echo "0")
            
            echo "Errors: $ERRORS, Failures: $FAILURES"
            
            if [ "$ERRORS" -gt 10 ] || [ "$FAILURES" -gt 5 ]; then
              echo "⚠️  High error rate detected"
              exit 1
            fi
          fi
      
      - name: Persist metrics to database
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "harvest_metrics_${TARGET_YEAR}.json" ]; then
            echo "📊 Persisting metrics to database..."
            python3 << 'PYEOF'
          import json
          import os
          import psycopg2
          from psycopg2.extras import Json
          
          year = os.getenv('TARGET_YEAR')
          metrics_file = f"harvest_metrics_{year}.json"
          
          with open(metrics_file) as f:
              summary = json.load(f)
          
          conn = psycopg2.connect(os.getenv('DATABASE_URL'))
          cur = conn.cursor()
          
          cur.execute("""
              INSERT INTO harvest_metrics 
              (harvest_year, duration_seconds, gazettes_discovered, gazettes_processed,
               gazettes_failed, acts_extracted, acts_stored, error_count, summary)
              VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s)
          """, (
              int(year),
              summary['duration_seconds'],
              summary['gazettes']['discovered'],
              summary['gazettes']['processed'],
              summary['gazettes']['failed'],
              summary['acts']['extracted'],
              summary['acts']['stored'],
              summary['errors']['total'],
              Json(summary)
          ))
          
          conn.commit()
          conn.close()
          
          print(f"✅ Metrics persisted for year {year}")
          PYEOF
          else
            echo "⚠️  Metrics file not found, skipping database insert"
          fi
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Gazette Harvest Failed: ${process.env.TARGET_YEAR}`,
              body: `Harvest job failed for year ${process.env.TARGET_YEAR}\n\n` +
                    `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
                    `Please check the logs for details.`,
              labels: ['automated', 'harvest-failure', 'needs-review']
            })
  
  # Post-harvest analysis
  analyze:
    runs-on: ubuntu-latest
    needs: harvest
    if: always() && needs.harvest.result != 'cancelled'
    environment: production
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_YEAR: ${{ github.event.inputs.target_year || '1950' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary
      
      - name: Generate report
        run: |
          python3 << 'PYEOF'
          import psycopg2
          import os
          
          conn = psycopg2.connect(os.getenv('DATABASE_URL'))
          cur = conn.cursor()
          
          year = int(os.getenv('TARGET_YEAR'))
          
          # Get manifest stats
          cur.execute('''
              SELECT 
                  status,
                  COUNT(*) as count,
                  SUM(acts_extracted) as total_acts
              FROM ingestion_manifest
              WHERE year = %s
              GROUP BY status
              ORDER BY status
          ''', (year,))
          
          print('📊 Harvest Statistics for', year)
          print('=' * 50)
          for row in cur.fetchall():
              print(f'{row[0]:12} | Count: {row[1]:4} | Acts: {row[2] or 0:4}')
          
          # Get acts stats
          cur.execute('''
              SELECT 
                  COUNT(*) as total_acts,
                  COUNT(DISTINCT era) as eras,
                  AVG(confidence_probability) as avg_confidence
              FROM statutes
              WHERE EXTRACT(YEAR FROM assent_date) = %s
          ''', (year,))
          
          stats = cur.fetchone()
          if stats and stats[0]:
              print('\n📜 Acts Statistics')
              print('=' * 50)
              print(f'Total Acts:        {stats[0]}')
              print(f'Eras:              {stats[1]}')
              print(f'Avg Confidence:    {stats[2]:.3f}')
          
          conn.close()
          PYEOF
      
      - name: Check data quality
        run: |
          python3 << 'PYEOF'
          import psycopg2
          import os
          
          conn = psycopg2.connect(os.getenv('DATABASE_URL'))
          cur = conn.cursor()
          
          year = int(os.getenv('TARGET_YEAR'))
          
          # Find low confidence acts
          cur.execute('''
              SELECT act_number, confidence_probability, verification_status
              FROM statutes
              WHERE EXTRACT(YEAR FROM assent_date) = %s
              AND confidence_probability < 0.7
              ORDER BY confidence_probability
              LIMIT 10
          ''', (year,))
          
          low_conf = cur.fetchall()
          
          if low_conf:
              print('⚠️  Low Confidence Acts (require review):')
              for act in low_conf:
                  print(f'  {act[0]:25} | Confidence: {act[1]:.3f} | Status: {act[2]}')
          else:
              print('✅ All acts have acceptable confidence levels')
          
          conn.close()
          PYEOF

  # Retry failed gazettes (manual workflow only)
  retry-failures:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: harvest
    environment: production
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_YEAR: ${{ github.event.inputs.target_year || '1950' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psycopg2-binary
      
      - name: Retry failed gazettes
        run: |
          python3 << 'PYEOF'
          import psycopg2
          import os
          
          conn = psycopg2.connect(os.getenv('DATABASE_URL'))
          cur = conn.cursor()
          
          year = int(os.getenv('TARGET_YEAR'))
          
          # Reset failed gazettes with low retry count
          cur.execute('''
              UPDATE ingestion_manifest
              SET status = 'pending',
                  error_text = NULL
              WHERE status = 'failed' 
              AND retry_count < 3
              AND year = %s
              RETURNING gazette_id
          ''', (year,))
          
          reset_ids = cur.fetchall()
          reset_count = len(reset_ids)
          
          conn.commit()
          conn.close()
          
          print(f'✅ Reset {reset_count} failed gazettes for retry')
          for row in reset_ids:
              print(f'  - {row[0]}')
          PYEOF
