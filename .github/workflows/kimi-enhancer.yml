name: 🤖 Kimi Fix

on:
  issue_comment:
    types: [created]

jobs:
  fix:
    if: contains(github.event.comment.body, '/kimi-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
      - run: |
          pip install openai
          python -c "
          import openai
          client = openai.OpenAI(api_key='${{ secrets.KIMI_API_KEY }}', base_url='https://api.moonshot.cn/v1')
          # Read PR, get comments, fix them, commit
          "
