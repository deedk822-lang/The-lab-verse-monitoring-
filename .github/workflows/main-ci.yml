name: 🚀 Optimized CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# CRITICAL: Prevent multiple runs on same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # STAGE 1: Fast Checks (Run in Parallel) - ~2 minutes
  # ==========================================================================

  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "🔍 Validating JSON files..."
          find . -name "*.json" -not -path "*/node_modules/*" | while IFS= read -r file; do
            jq empty "$file" || exit 1
          done
          echo "✅ All JSON files valid"

      - name: Check for secrets
        run: |
          echo "🔒 Scanning for hardcoded secrets..."
          if grep -r -E "(api[_-]?key|secret|token|password).*=.*['\"][a-zA-Z0-9]{20,}['\"]" . --exclude-dir={node_modules,.git,dist}; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install ruff black isort mypy

      - name: Run Ruff
        run: ruff check . --output-format=github

      - name: Run Black
        run: black --check .
        continue-on-error: true

      - name: Run isort
        run: isort --check-only .
        continue-on-error: true

      - name: Type check with MyPy
        run: mypy --ignore-missing-imports src/ vaal_ai_empire/ agent/ app/

  # ==========================================================================
  # STAGE 2: Security Scans (Parallel) - ~3 minutes
  # ==========================================================================

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: [quick-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install safety bandit pip-audit semgrep

      - name: Run Safety
        run: safety check --json

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json

          # Fail if HIGH severity issues found
          if [ -f bandit-report.json ]; then
            HIGH_COUNT=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)
            if [ "$HIGH_COUNT" -gt 0 ]; then
              echo "❌ Found $HIGH_COUNT HIGH severity security issues"
              exit 1
            fi
          fi

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            --metrics=off

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep.sarif

  # ==========================================================================
  # STAGE 3: Tests (After linting passes) - ~5 minutes
  # ==========================================================================

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" || pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v -n auto \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests

  # ==========================================================================
  # STAGE 4: Build & Deploy (Only on success) - ~5 minutes
  # ==========================================================================

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-suite]
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # STAGE 5: Specialized Workflows (Optional, run conditionally)
  # ==========================================================================

  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'performance')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci || echo "No package.json found, skipping npm install"

      - name: Build application
        run: npm run build || echo "No build script found"

      - name: Start application server
        run: |
          npm run start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          npx wait-on http://localhost:3000 --timeout 60000 || {
            echo "❌ Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: http://localhost:3000
          uploadArtifacts: true

      - name: Stop application server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  # ==========================================================================
  # Summary Report
  # ==========================================================================

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [quick-validation, lint-and-format, security-scan, test-suite]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Validation | ${{ needs.quick-validation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint-and-format.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ needs.test-suite.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Total Runtime:** ~10-15 minutes" >> $GITHUB_STEP_SUMMARY
