name: Verify Secrets Configuration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-secrets:
    runs-on: ubuntu-22.04
    name: Verify Required Secrets
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Verify Core API Secrets
        run: |
          echo "🔍 Verifying Core API Secrets..."
          
          # Check if secrets are configured (will be empty if not set)
          [ -n "${{ secrets.NOTION_API_KEY }}" ] && echo "✅ NOTION_API_KEY configured" || echo "❌ NOTION_API_KEY missing"
          [ -n "${{ secrets.MISTRAL_API_KEY }}" ] && echo "✅ MISTRAL_API_KEY configured" || echo "❌ MISTRAL_API_KEY missing"
          [ -n "${{ secrets.GROQ_API_KEY }}" ] && echo "✅ GROQ_API_KEY configured" || echo "❌ GROQ_API_KEY missing"
          [ -n "${{ secrets.GEMINI_API_KEY }}" ] && echo "✅ GEMINI_API_KEY configured" || echo "❌ GEMINI_API_KEY missing"
          [ -n "${{ secrets.BRIA_API_KEY }}" ] && echo "✅ BRIA_API_KEY configured" || echo "❌ BRIA_API_KEY missing"
          [ -n "${{ secrets.HF_API_TOKEN }}" ] && echo "✅ HF_API_TOKEN configured" || echo "❌ HF_API_TOKEN missing"
      
      - name: Verify Cloud Infrastructure Secrets
        run: |
          echo ""
          echo "☁️ Verifying Cloud Infrastructure Secrets..."
          
          [ -n "${{ secrets.ALIBABA_ACCESS_KEY_ID }}" ] && echo "✅ ALIBABA_ACCESS_KEY_ID configured" || echo "❌ ALIBABA_ACCESS_KEY_ID missing"
          [ -n "${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}" ] && echo "✅ ALIBABA_ACCESS_KEY_SECRET configured" || echo "❌ ALIBABA_ACCESS_KEY_SECRET missing"
          [ -n "${{ secrets.VERCEL_TOKEN }}" ] && echo "✅ VERCEL_TOKEN configured" || echo "❌ VERCEL_TOKEN missing"
      
      - name: Verify Marketing & Distribution Secrets
        run: |
          echo ""
          echo "📢 Verifying Marketing & Distribution Secrets..."
          
          [ -n "${{ secrets.AYRSHARE_API_KEY }}" ] && echo "✅ AYRSHARE_API_KEY configured" || echo "⚠️  AYRSHARE_API_KEY missing (optional)"
          [ -n "${{ secrets.MAILCHIMP_API_KEY }}" ] && echo "✅ MAILCHIMP_API_KEY configured" || echo "⚠️  MAILCHIMP_API_KEY missing (optional)"
          [ -n "${{ secrets.GOOGLE_ADS_API_KEY }}" ] && echo "✅ GOOGLE_ADS_API_KEY configured" || echo "⚠️  GOOGLE_ADS_API_KEY missing (optional)"
          [ -n "${{ secrets.BRAVE_ADS_API_KEY }}" ] && echo "✅ BRAVE_ADS_API_KEY configured" || echo "⚠️  BRAVE_ADS_API_KEY missing (optional)"
      
      - name: Verify Project Management Secrets
        run: |
          echo ""
          echo "📊 Verifying Project Management Secrets..."
          
          [ -n "${{ secrets.GRAFANA_TOKEN }}" ] && echo "✅ GRAFANA_TOKEN configured" || echo "⚠️  GRAFANA_TOKEN missing (optional)"
          [ -n "${{ secrets.ASANA_TOKEN }}" ] && echo "✅ ASANA_TOKEN configured" || echo "⚠️  ASANA_TOKEN missing (optional)"
          [ -n "${{ secrets.ASANA_WORKSPACE_ID }}" ] && echo "✅ ASANA_WORKSPACE_ID configured" || echo "⚠️  ASANA_WORKSPACE_ID missing (optional)"
      
      - name: Scan for Hardcoded Secrets
        run: |
          echo ""
          echo "🔒 Scanning for hardcoded secrets in workflows..."
          
          # Check for potential API keys
          if grep -r -E "(api[_-]?key|secret|token|password).*=.*['\"].*['\"]" .github/workflows/ --exclude="verify-secrets.yml" --exclude="*.md"; then
            echo "⚠️  WARNING: Found potential hardcoded secrets!"
            echo "Please review the above matches and ensure they use GitHub Secrets."
          else
            echo "✅ No hardcoded secrets pattern found"
          fi
          
          # Check for hardcoded URLs with tokens
          if grep -r -E "https?://[^\s]*\?.*token=[a-zA-Z0-9]" .github/workflows/ --exclude="verify-secrets.yml" --exclude="*.md"; then
            echo "⚠️  WARNING: Found URLs with potential tokens!"
          else
            echo "✅ No URLs with tokens found"
          fi
          
          # Check for AWS ARNs with account IDs
          if grep -r -E "arn:aws:[a-z]+:[a-z0-9-]+:[0-9]{12}:" .github/workflows/ --exclude="verify-secrets.yml" --exclude="*.md"; then
            echo "⚠️  WARNING: Found hardcoded AWS ARNs with account IDs!"
          else
            echo "✅ No hardcoded ARNs found"
          fi
          
          # Check for Alibaba Cloud ARNs
          if grep -r -E "acs:[a-z]+:[a-z0-9-]+:[0-9]+:analyzer" .github/workflows/ --exclude="verify-secrets.yml" --exclude="*.md"; then
            echo "⚠️  WARNING: Found hardcoded Alibaba ARNs!"
          else
            echo "✅ No hardcoded Alibaba ARNs found"
          fi
      
      - name: Generate Secrets Report
        run: |
          echo ""
          echo "📋 Secrets Configuration Report"
          echo "=============================="
          echo ""
          echo "✅ = Configured and available"
          echo "❌ = Missing (required for core workflows)"
          echo "⚠️  = Missing (optional for some workflows)"
          echo ""
          echo "For detailed setup instructions, see SECURITY.md"
          echo ""
          echo "To configure secrets:"
          echo "1. Go to Settings → Secrets and variables → Actions"
          echo "2. Click 'New repository secret'"
          echo "3. Add each required secret from SECURITY.md"
      
      - name: Summary
        run: |
          echo "## 🔐 Secrets Verification Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📚 **Documentation:** See [SECURITY.md](./SECURITY.md) for complete setup guide." >> $GITHUB_STEP_SUMMARY
