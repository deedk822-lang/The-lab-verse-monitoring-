image: python:3.11-slim

definitions:
  caches:
    pip: ~/.cache/pip
    docker: ~/.docker

  services:
    docker:
      memory: 3072

pipelines:
  default:
    - parallel:
        - step:
            name: Security Scan
            caches:
              - pip
            script:
              - apt-get update && apt-get install -y gcc git openssh-client
              - pip install --upgrade pip setuptools wheel
              - pip install bandit safety pip-audit
              - echo "Running Bandit security scan..."
              - bandit -r src/ -ll -ii -f json -o bandit-report.json || true
              - bandit -r src/ -ll -ii
              - echo "Auditing dependencies..."
              - pip-audit --desc
              - safety check -r requirements.txt
            artifacts:
              - bandit-report.json

        - step:
            name: Code Quality
            caches:
              - pip
            script:
              - apt-get update && apt-get install -y gcc git openssh-client
              - pip install --upgrade pip setuptools wheel
              - pip install black isort flake8 mypy
              - black --check --diff src/ tests/
              - isort --check-only --diff src/ tests/
              - flake8 src/ tests/ --max-line-length=88 --extend-ignore=E203,W503
              - mypy src/ --ignore-missing-imports --strict

        - step:
            name: Unit Tests and Coverage
            caches:
              - pip
            script:
              - apt-get update && apt-get install -y gcc git openssh-client
              - pip install --upgrade pip setuptools wheel
              - pip install -r requirements.txt
              - pip install pytest pytest-cov pytest-html pytest-asyncio
              - pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80 --html=test-report.html --self-contained-html
              - echo "Coverage percent: $(grep -o 'percent=\"[0-9]*\"' coverage.xml | head -1 | grep -o '[0-9]*')"
            artifacts:
              - coverage.xml
              - htmlcov/**
              - test-report.html

    - step:
        name: Build Docker Image
        image: atlassian/default-image:3
        caches:
          - docker
        services:
          - docker
        script:
          - IMAGE_NAME="$DOCKER_USERNAME/the-lab-verse-monitoring"
          - docker build -t "$IMAGE_NAME:$BITBUCKET_COMMIT" .
          - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          - docker push "$IMAGE_NAME:$BITBUCKET_COMMIT"
          - |
            if [ "$BITBUCKET_BRANCH" = "main" ] || [ "$BITBUCKET_BRANCH" = "develop" ]; then
              docker tag "$IMAGE_NAME:$BITBUCKET_COMMIT" "$IMAGE_NAME:latest"
              docker push "$IMAGE_NAME:latest"
            else
              echo "Skipping latest push for branch: $BITBUCKET_BRANCH"
            fi

  pull-requests:
    "**":
      - parallel:
          - step:
              name: PR Validation
              caches:
                - pip
              script:
                - apt-get update && apt-get install -y gcc git openssh-client
                - pip install --upgrade pip setuptools wheel
                - pip install -r requirements.txt
                - pip install black isort flake8 pytest
                - black --check src/ tests/
                - isort --check-only src/ tests/
                - flake8 src/ tests/
                - pytest tests/ -v --cov=src --cov-fail-under=70

          - step:
              name: Rovo AI Review
              image: atlassian/default-image:3
              script:
                - acli rovodev auth login
                - acli rovodev run

  branches:
    develop:
      - step:
          name: Deploy to Staging
          deployment: staging
          trigger: automatic
          caches:
            - pip
          script:
            - apt-get update && apt-get install -y gcc git openssh-client ssh
            - pip install --upgrade pip setuptools wheel
            - pip install requests
            - mkdir -p ~/.ssh
            - echo "$STAGING_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
            - ssh "$STAGING_USER@$STAGING_HOST" "cd /opt/monitoring && docker-compose pull && docker-compose up -d"
            - sleep 10
            - python -c "import requests; r=requests.get('$STAGING_URL/health', timeout=10); raise SystemExit(0 if r.status_code==200 else 1)"

    main:
      - step:
          name: Deploy to Production
          deployment: production
          trigger: manual
          caches:
            - pip
          script:
            - apt-get update && apt-get install -y gcc git openssh-client ssh
            - pip install --upgrade pip setuptools wheel
            - pip install requests
            - mkdir -p ~/.ssh
            - echo "$PROD_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
            - ssh "$PROD_USER@$PROD_HOST" "cd /opt/monitoring && docker-compose -f docker-compose.prod.yml pull && docker-compose -f docker-compose.prod.yml up -d"
            - sleep 15
            - python -c "import requests; r=requests.get('$PROD_URL/health', timeout=10); print('Status:', r.status_code); raise SystemExit(0 if r.status_code==200 else 1)"
